[project]
name = "ontogen"
version = "0.1.0"
description = "Webサイトを解析してディスカバリー用のオントロジー叩き台を自動生成する"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
ontogen = "ontogen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
